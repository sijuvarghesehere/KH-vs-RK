<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#000000">

<title>KH vs RK</title>

<link rel="manifest"
      href="manifest.json">

<link rel="stylesheet"
      href="style.css">

<script src="script.js"
        defer></script>

</head>

<body>

<div class="background"></div>

<div class="overlay"></div>

<div class="container">
      <div class="game-panel">

<div class="hero">

<div class="hero-left">

<h1 class="kh">
KH
</h1>

<p>
Kamal Haasan
</p>

</div>

<div class="vs">
VS
</div>

<div class="hero-right">

<h1 class="rk">
RK
</h1>

<p>
Rajinikanth
</p>

</div>

</div>

<div class="status"
     id="status">

<span class="kh">
KH Turn
</span>

</div>

<div class="board"
     id="board">

<div class="strike"
     id="strike"></div>

<div class="cell"
     data-index="0"></div>

<div class="cell"
     data-index="1"></div>

<div class="cell"
     data-index="2"></div>

<div class="cell"
     data-index="3"></div>

<div class="cell"
     data-index="4"></div>

<div class="cell"
     data-index="5"></div>

<div class="cell"
     data-index="6"></div>

<div class="cell"
     data-index="7"></div>

<div class="cell"
     data-index="8"></div>

</div>

<button id="restartBtn">

RESTART GAME

</button>

<div class="dashboard">

<div class="card">

<h3 class="kh">
KH
</h3>

<p>
Legend Mode
</p>

</div>

<div class="card">

<h3>
VS
</h3>

<p>
Cinematic Battle
</p>

</div>

<div class="card">

<h3 class="rk">
RK
</h3>

<p>
Superstar Mode
</p>

</div>

</div>
      </div>
</div>

</body>
</html>
