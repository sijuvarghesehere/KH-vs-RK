<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>KH vs RK</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">

<link rel="stylesheet" href="style.css">

<script type="module" src="firebase.js"></script>

<script type="module" src="script.js"></script>

</head>

<body>

<div class="overlay"></div>

<div class="game-container">

    <div class="logo-area">
        <div class="player-side kh-side">
            <h1>KH</h1>
            <p>Kamal Haasan</p>
        </div>

        <div class="center-logo">
            <h2>VS</h2>
        </div>

        <div class="player-side rk-side">
            <h1>RK</h1>
            <p>Rajinikanth</p>
        </div>
    </div>

    <div class="mode-select">
        <button id="pvpBtn" class="active">2 Players</button>
        <button id="aiBtn">Vs Computer</button>
        <button id="onlineBtn">Online</button>
    </div>

    <div class="online-controls">
        <input type="text" id="roomInput" placeholder="Room Code">
        <button id="createRoom">Create</button>
        <button id="joinRoom">Join</button>
    </div>

    <div id="status" class="status">KH Turn</div>

    <div class="board" id="board">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>

    <button class="restart-btn" id="restartBtn">
        RESTART GAME
    </button>

    <div class="scoreboard">

        <div class="score-card kh-card">
            <h2>KH</h2>
            <p>Legend Mode</p>
            <span id="khScore">0</span>
        </div>

        <div class="score-card draw-card">
            <h2>DRAW</h2>
            <p>Cinematic Battle</p>
            <span id="drawScore">0</span>
        </div>

        <div class="score-card rk-card">
            <h2>RK</h2>
            <p>Superstar Mode</p>
            <span id="rkScore">0</span>
        </div>

    </div>

</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="script.js"></script>

</body>
</html>
