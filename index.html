<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0"/>

  <title>KH vs RK</title>

  <!-- PWA -->

  <meta name="theme-color" content="#000000"/>

  <link rel="manifest" href="manifest.json"/>

  <link rel="icon" href="icon.png"/>

  <!-- CSS -->

  <link rel="stylesheet" href="style.css"/>

</head>

<body>

  <!-- BACKGROUND -->

  <div class="background"></div>

  <div class="overlay"></div>

  <!-- MAIN CONTAINER -->

  <div class="container">

    <!-- GAME PANEL -->

    <div class="game-panel">

      <!-- TOP HERO -->

      <div class="hero">

        <!-- KH -->

        <div class="hero-box">

          <h1 class="kh">
            KH
          </h1>

          <p>
            Kamal Haasan
          </p>

        </div>

        <!-- VS -->

        <div class="vs">
          VS
        </div>

        <!-- RK -->

        <div class="hero-box">

          <h1 class="rk">
            RK
          </h1>

          <p>
            Rajinikanth
          </p>

        </div>

      </div>

      <!-- STATUS -->

      <div class="status"
           id="status">

        KH Turn

      </div>

      <!-- GAME BOARD -->

      <div class="board"
           id="board">

        <!-- ROW 1 -->

        <div class="cell"
             data-index="0"></div>

        <div class="cell"
             data-index="1"></div>

        <div class="cell"
             data-index="2"></div>

        <!-- ROW 2 -->

        <div class="cell"
             data-index="3"></div>

        <div class="cell"
             data-index="4"></div>

        <div class="cell"
             data-index="5"></div>

        <!-- ROW 3 -->

        <div class="cell"
             data-index="6"></div>

        <div class="cell"
             data-index="7"></div>

        <div class="cell"
             data-index="8"></div>

        <!-- STRIKE LINE -->

        <div class="strike"
             id="strike"></div>

      </div>

      <!-- RESTART BUTTON -->

      <button id="restartBtn">

        RESTART GAME

      </button>

      <!-- DASHBOARD -->

      <div class="dashboard">

        <!-- KH SCORE -->

        <div class="card">

          <h3 class="kh">
            KH
          </h3>

          <p>
            Legend Mode
          </p>

          <span id="khScore">
            0
          </span>

        </div>

        <!-- DRAW -->

        <div class="card">

          <h3>
            DRAW
          </h3>

          <p>
            Cinematic Battle
          </p>

          <span id="drawScore">
            0
          </span>

        </div>

        <!-- RK SCORE -->

        <div class="card">

          <h3 class="rk">
            RK
          </h3>

          <p>
            Superstar Mode
          </p>

          <span id="rkScore">
            0
          </span>

        </div>

      </div>

    </div>

  </div>

  <!-- JAVASCRIPT -->

  <script src="script.js"></script>

</body>

</html>
