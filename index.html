<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>KH vs RK</title>

  <link rel="stylesheet" href="style.css" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
</head>

<body>

  <div class="app">

    <!-- TOP -->
    <div class="top">

      <div class="hero leftHero">
        <div class="abbr khGlow">KH</div>
        <div class="name">Kamal Haasan</div>
      </div>

      <div class="versus">VS</div>

      <div class="hero rightHero">
        <div class="abbr rkGlow">RK</div>
        <div class="name">Rajinikanth</div>
      </div>

    </div>

    <!-- MODES -->
    <div class="modes">

      <button class="modeBtn activeMode" id="twoPlayerBtn">
        2 Players
      </button>

      <button class="modeBtn" id="computerBtn">
        Vs Computer
      </button>

      <button class="modeBtn" id="onlineBtn">
        Online
      </button>

    </div>

    <!-- ONLINE -->
    <div class="onlineSection">

      <input
        type="text"
        id="roomInput"
        placeholder="Room Code"
      />

      <button id="createRoomBtn">
        Create
      </button>

      <button id="joinRoomBtn">
        Join
      </button>

    </div>

    <!-- PLAYER PICK -->
    <div class="chooseSide">

      <button class="sideBtn activeSide" id="chooseKH">
        Play as KH
      </button>

      <button class="sideBtn" id="chooseRK">
        Play as RK
      </button>

    </div>

    <!-- STATUS -->
    <div class="status" id="statusText">
      KH Turn
    </div>

    <!-- GAME BOARD -->
    <div class="board" id="board">

      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>

      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>

      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>

    </div>

    <!-- RESTART -->
    <button class="restartBtn" id="restartBtn">
      RESTART GAME
    </button>

    <!-- SCORE -->
    <div class="scores">

      <div class="scoreCard">
        <h2 class="khGlow">KH</h2>
        <p>Legend Mode</p>
        <span id="khScore">0</span>
      </div>

      <div class="scoreCard">
        <h2>DRAW</h2>
        <p>Cinematic Battle</p>
        <span id="drawScore">0</span>
      </div>

      <div class="scoreCard">
        <h2 class="rkGlow">RK</h2>
        <p>Superstar Mode</p>
        <span id="rkScore">0</span>
      </div>

    </div>

  </div>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script src="firebase.js"></script>
  <script src="script.js"></script>

</body>
</html>
