<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#111827">

  <title>KH vs RK</title>

  <link rel="manifest"
        href="manifest.json">

  <link rel="stylesheet"
        href="style.css">

  <script src="script.js"
          defer></script>

</head>

<body>

  <div class="container">

    <h1>
      KH vs RK
    </h1>

    <div class="status"
         id="status">

      <span class="kh">
        KH Turn
      </span>

    </div>

    <div class="board"
         id="board">

      <div class="strike"
           id="strike"></div>

      <div class="cell"
           data-index="0"></div>

      <div class="cell"
           data-index="1"></div>

      <div class="cell"
           data-index="2"></div>

      <div class="cell"
           data-index="3"></div>

      <div class="cell"
           data-index="4"></div>

      <div class="cell"
           data-index="5"></div>

      <div class="cell"
           data-index="6"></div>

      <div class="cell"
           data-index="7"></div>

      <div class="cell"
           data-index="8"></div>

    </div>

    <button id="restartBtn">
      Restart Game
    </button>

  </div>

</body>
</html>
