<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>KH vs RK</title>

  <link rel="stylesheet" href="style.css" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
</head>
<body>

<div class="container">

  <!-- TOP -->

  <div class="top-section">

    <div class="player-side">
      <div class="kh-text">KH</div>
      <div class="player-name">Kamal Haasan</div>
    </div>

    <div class="vs-text">VS</div>

    <div class="player-side">
      <div class="rk-text">RK</div>
      <div class="player-name">Rajinikanth</div>
    </div>

  </div>

  <!-- MODES -->

  <div class="mode-buttons">

    <button id="twoPlayerBtn" class="active">
      2 Players
    </button>

    <button id="vsComputerBtn">
      Vs Computer
    </button>

    <button id="onlineBtn">
      Online
    </button>

  </div>

  <!-- ROOM -->

  <div class="online-controls">

    <input
      type="text"
      id="roomInput"
      placeholder="Room Code"
    >

    <button id="createRoomBtn">
      Create
    </button>

    <button id="joinRoomBtn">
      Join
    </button>

  </div>

  <!-- CHOOSE -->

  <div class="choose-side">

    <button id="chooseKHBtn">
      Play as KH
    </button>

    <button id="chooseRKBtn">
      Play as RK
    </button>

  </div>

  <!-- TURN -->

  <div class="turn-box" id="turnText">
    KH Turn
  </div>

  <!-- BOARD -->

  <div class="board">

    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>

    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>

    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>

  </div>

  <!-- RESTART -->

  <button
    class="restart-btn"
    id="restartBtn"
  >
    RESTART GAME
  </button>

  <!-- SCORE -->

  <div class="scoreboard">

    <div class="score-card">

      <div class="score-title kh-score">
        KH
      </div>

      <div class="score-sub">
        Legend Mode
      </div>

      <div
        class="score-value"
        id="khScore"
      >
        0
      </div>

    </div>

    <div class="score-card">

      <div class="score-title">
        DRAW
      </div>

      <div class="score-sub">
        Cinematic Battle
      </div>

      <div
        class="score-value"
        id="drawScore"
      >
        0
      </div>

    </div>

    <div class="score-card">

      <div class="score-title rk-score">
        RK
      </div>

      <div class="score-sub">
        Superstar Mode
      </div>

      <div
        class="score-value"
        id="rkScore"
      >
        0
      </div>

    </div>

  </div>

</div>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="firebase.js"></script>

<script src="script.js"></script>

</body>
</html>
